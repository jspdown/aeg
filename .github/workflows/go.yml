name: Go

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Opens a pull request when go.dev has a newer patch release of the Go minor version in go.json.
  update:
    runs-on: ubuntu-26.04
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - run: .github/update-go.sh
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git diff --quiet && exit 0

          version="$(jq -r .version go.json)"
          branch="update-go-$version"

          git switch -c "$branch"
          git -c user.name="aeg-renovate[bot]" -c user.email="aeg-renovate[bot]@users.noreply.github.com" \
            commit -am "build: update Go to $version"
          git push --force origin "$branch"

          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --head "$branch" \
            --title "build: update Go to $version" \
            --body "go.dev released Go $version. See https://go.dev/doc/devel/release for its fixes."
